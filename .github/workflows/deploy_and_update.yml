name: DART update and GitHub Pages deploy

on:
  workflow_dispatch:
  schedule:
    # Every month on the 1st at 03:00 UTC = 12:00 KST.
    - cron: "0 3 1 * *"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy_and_update.yml"
      - "update_data.py"
      - "analyze.py"
      - "config.json"
      - "requirements.txt"
      - "index.html"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect DART data
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python update_data.py

      - name: Analyze financial data
        run: python analyze.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update DART financial data"
            git push
          else
            echo "No data changes to commit."
          fi

  deploy:
    needs: update-data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
